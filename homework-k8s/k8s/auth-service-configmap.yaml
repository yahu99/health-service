apiVersion: v1
kind: ConfigMap
metadata:
  name: health-auth-service-config
  namespace: yahu
  labels:
    app: health-auth-service
data:
  PORT: "8002"
  SERVICE_NAME: "health-auth-service"
  LOG_LEVEL: "info"
  TRUST_PROXY: "true"

  SESSION_TTL_SECONDS: "86400"
  COOKIE_SECURE: "false"

  DB_HOST: "users-db-postgresql"
  DB_PORT: "5432"
  DB_NAME: "users"
  DB_POOL_SIZE: "10"
  DB_CONNECTION_TIMEOUT_MS: "3000"
  DB_SSL: "false"
