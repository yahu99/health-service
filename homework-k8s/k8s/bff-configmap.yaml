apiVersion: v1
kind: ConfigMap
metadata:
  name: health-bff-config
  namespace: yahu
  labels:
    app: health-bff
data:
  PORT: "8001"
  SERVICE_NAME: "health-bff"
  LOG_LEVEL: "info"
  TRUST_PROXY: "true"

  AUTH_SERVICE_URL: "http://health-auth-service"
  AUTH_SERVICE_TIMEOUT_MS: "3000"
  PROFILE_SERVICE_URL: "http://health-service"
  PROFILE_SERVICE_TIMEOUT_MS: "3000"

  BILLING_SERVICE_URL: "http://health-billing-service"
  ORDER_SERVICE_URL: "http://health-order-service"
  WAREHOUSE_SERVICE_URL: "http://health-warehouse-service"
  DELIVERY_SERVICE_URL: "http://health-delivery-service"
  NOTIFICATION_SERVICE_URL: "http://health-notification-service"
  COMMERCE_TIMEOUT_MS: "15000"
