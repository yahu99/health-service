apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-bff
  namespace: yahu
  labels:
    app: health-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: health-bff
  template:
    metadata:
      labels:
        app: health-bff
    spec:
      containers:
        - name: health-bff
          image: yahurt/health-bff:3.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: health-bff-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
