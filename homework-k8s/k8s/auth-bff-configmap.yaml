apiVersion: v1
kind: ConfigMap
metadata:
  name: health-auth-bff-config
  namespace: yahu
  labels:
    app: health-auth-bff
data:
  PORT: "8001"
  SERVICE_NAME: "health-auth-bff"
  LOG_LEVEL: "info"
  TRUST_PROXY: "true"

  PROFILE_SERVICE_URL: "http://health-service"
  PROFILE_SERVICE_TIMEOUT_MS: "3000"

  SESSION_TTL_SECONDS: "86400"
  COOKIE_SECURE: "false"

  DB_HOST: "users-db-postgresql"
  DB_PORT: "5432"
  DB_NAME: "users"
  DB_POOL_SIZE: "10"
  DB_CONNECTION_TIMEOUT_MS: "3000"
  DB_SSL: "false"
