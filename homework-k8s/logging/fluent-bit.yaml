apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: yahu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: yahu
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
  namespace: yahu
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush     5
        Log_Level info

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/*fluent-bit*
        multiline.parser  docker
        Skip_Long_Lines   On
        DB                /var/fluent-bit-state/flb_kube.db

    [FILTER]
        Name       kubernetes
        Match      kube.*
        Merge_Log  On
        Keep_Log   Off

    [FILTER]
        Name   grep
        Match  kube.*
        Regex  $kubernetes['labels']['app'] ^health-service$

    [OUTPUT]
        Name                es
        Match               kube.*
        Host                elasticsearch
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     fluent-bit-logs
        Suppress_Type_Name  On
        Replace_Dots        On
        Retry_Limit         5
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: yahu
  labels:
    app: fluent-bit
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:3.2.10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/
            - name: state
              mountPath: /var/fluent-bit-state
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: config
          configMap:
            name: fluent-bit
        - name: state
          hostPath:
            path: /var/fluent-bit-state
            type: DirectoryOrCreate
