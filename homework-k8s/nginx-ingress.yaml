controller:
  kind: DaemonSet

  reportNodeInternalIp: true

  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443

  service:
    type: NodePort

  metrics:
    enabled: true

    service:
      enabled: true

    serviceMonitor:
      enabled: true

      additionalLabels:
        release: monitoring

      scrapeInterval: 15s
      scrapeTimeout: 10s