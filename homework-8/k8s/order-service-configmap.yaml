apiVersion: v1
kind: ConfigMap
metadata:
  name: health-order-service-config
  namespace: yahu
  labels:
    app: health-order-service
data:
  PORT: "8004"
  SERVICE_NAME: "health-order-service"
  LOG_LEVEL: "info"
  TRUST_PROXY: "true"


  DB_HOST: "users-db-postgresql"
  DB_PORT: "5432"
  DB_NAME: "users"
  DB_POOL_SIZE: "10"
  DB_CONNECTION_TIMEOUT_MS: "3000"
  DB_SSL: "false"

  BILLING_SERVICE_URL: "http://health-billing-service"
  WAREHOUSE_SERVICE_URL: "http://health-warehouse-service"
  DELIVERY_SERVICE_URL: "http://health-delivery-service"
  SAGA_POLL_MS: "1000"
  SAGA_RETRY_BASE_MS: "1000"
  SAGA_RETRY_MAX_MS: "30000"
  NOTIFICATION_SERVICE_URL: "http://health-notification-service"
  SERVICE_TIMEOUT_MS: "5000"
